<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VAULT — offline</title>
    <meta name="theme-color" content="#080b14" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b14;
        --text: #f5f7fc;
        --muted: #8993a8;
        --accent: #69d9ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(60% 50% at 18% 8%, rgba(105, 217, 255, 0.18), transparent 70%),
          radial-gradient(50% 50% at 88% 92%, rgba(139, 140, 255, 0.16), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.055);
        backdrop-filter: blur(26px) saturate(1.4);
        -webkit-backdrop-filter: blur(26px) saturate(1.4);
        box-shadow: 0 50px 90px -60px #000, inset 0 1px 0 rgba(255, 255, 255, 0.14);
        padding: 30px 28px;
        text-align: center;
      }
      .mark {
        width: 46px;
        height: 46px;
        margin: 0 auto 16px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, rgba(105, 217, 255, 0.9), rgba(139, 140, 255, 0.85));
        color: #04121c;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.03em;
      }
      h1 { margin: 0 0 8px; font-size: 19px; letter-spacing: -0.02em; font-weight: 600; }
      p { margin: 0 0 20px; font-size: 13px; line-height: 1.65; color: var(--muted); }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: #04121c;
        background: var(--accent);
        border-radius: 11px;
        padding: 10px 18px;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }
      button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -12px rgba(105, 217, 255, 0.7); }
      .note { margin: 16px 0 0; font-size: 11.5px; color: rgba(137, 147, 168, 0.75); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">V</div>
      <h1>You are offline</h1>
      <p>
        VAULT could not reach the network. Your saved tasks, events, grades and documents stay on this device —
        reconnect to load the workspace again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="note">VAULT — Personal OS</p>
    </div>
  </body>
</html>
